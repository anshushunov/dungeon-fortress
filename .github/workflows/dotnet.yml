name: Pure .NET

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - name: Restore tests, domain MCP, and scenario runner
        run: |
          dotnet restore tests/DungeonFortress.Simulation.Tests/DungeonFortress.Simulation.Tests.csproj
          dotnet restore tests/DungeonFortress.Presentation.Tests/DungeonFortress.Presentation.Tests.csproj
          dotnet restore tests/DungeonFortress.DomainMcp.Tests/DungeonFortress.DomainMcp.Tests.csproj --locked-mode
          dotnet restore tests/DungeonFortress.Scenarios/DungeonFortress.Scenarios.csproj

      # DungeonFortress.Presentation carries the HUD and inspector text. It does
      # not reference Godot, so this job checks the golden UI wording on every
      # pull request instead of only on the machine that can start an engine.
      - name: Build and test engine-independent projects
        run: |
          dotnet test tests/DungeonFortress.Simulation.Tests/DungeonFortress.Simulation.Tests.csproj --configuration Release --no-restore
          dotnet test tests/DungeonFortress.Presentation.Tests/DungeonFortress.Presentation.Tests.csproj --configuration Release --no-restore
          dotnet test tests/DungeonFortress.DomainMcp.Tests/DungeonFortress.DomainMcp.Tests.csproj --configuration Release --no-restore

      - name: Run deterministic scenario CLI
        run: >-
          dotnet run
          --project tests/DungeonFortress.Scenarios/DungeonFortress.Scenarios.csproj
          --configuration Release
          --no-restore
          --
          --seed 424242
          --agents 32
          --ticks 256
          --commands scenarios/smoke.commands.json
